name: Sync to BlueDot-IT

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bluedot-sync-hub
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap and sync mirrors
        env:
          ORG_SYNC_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        run: |
          if [ -z "$ORG_SYNC_TOKEN" ]; then
            echo "ORG_SYNC_TOKEN is not configured; skipping."
            exit 0
          fi

          git remote set-url origin "https://x-access-token:${ORG_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          sync_one() {
            mirror_branch="$1"
            target_repo="$2"
            source_ref="refs/remotes/origin/${mirror_branch}"

            git remote remove bluedot_target 2>/dev/null || true
            git remote add bluedot_target "https://x-access-token:${ORG_SYNC_TOKEN}@github.com/BlueDot-IT/${target_repo}.git"
            git fetch --no-tags bluedot_target main

            if ! git ls-remote --exit-code --heads origin "$mirror_branch" >/dev/null 2>&1; then
              echo "${mirror_branch}: bootstrapping from BlueDot-IT/${target_repo}:main"
              git push origin "refs/remotes/bluedot_target/main:refs/heads/${mirror_branch}"
            fi

            git fetch --no-tags origin "refs/heads/${mirror_branch}:${source_ref}"

            if [ "$(git rev-parse "$source_ref")" = "$(git rev-parse bluedot_target/main)" ]; then
              echo "${target_repo}: already synchronized."
              return 0
            fi

            git merge-base --is-ancestor bluedot_target/main "$source_ref" || {
              echo "Refusing ${target_repo} sync: organization main contains commits not present in ${mirror_branch}." >&2
              return 1
            }

            git push bluedot_target "${source_ref}:refs/heads/main"
          }

          sync_one org-sync DemonClaw
          sync_one bridge/agent-benchmarks agent-benchmarks
          sync_one bridge/org-dot-github .github
          sync_one bridge/odinn-maintainer odinn-maintainer
