<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% block title %}DemonClaw{% endblock %}</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg-surf:#12121a;--bg-elev:#1a1a28;--bg-hover:#222236;
  --brd:#2a2a40;--brd-glow:#6b2fa0;
  --txt:#e0e0e8;--txt-dim:#7878a0;--txt-brt:#fff;
  --acc:#9b4dff;--acc-dim:#6b2fa0;
  --red:#ff3d57;--red-dim:#8b1a2a;
  --grn:#3dff9b;--grn-dim:#1a8b4f;
  --ylw:#ffd73d;--ylw-dim:#8b7a1a;
  --cyn:#3ddeff;--cyn-dim:#1a6b8b;
}
body{background:var(--bg);color:var(--txt);font-family:'JetBrains Mono','Fira Code','Consolas',monospace;min-height:100vh;line-height:1.6;font-size:14px}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);pointer-events:none;z-index:9999}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.wrap{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
/* sidebar */
.sb{background:var(--bg-surf);border-right:1px solid var(--brd);padding:16px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-logo{padding:0 16px 16px;border-bottom:1px solid var(--brd);margin-bottom:8px}
.sb-logo a{color:var(--txt-brt);font-weight:700;font-size:1.1rem;letter-spacing:.05em}
.sb-logo a span{color:var(--acc)}
.sb-sec{padding:12px 16px 4px;font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;color:var(--txt-dim)}
.sb-nav{display:block;padding:7px 16px;color:var(--txt);font-size:.82rem;border-left:3px solid transparent;transition:all .12s}
.sb-nav:hover{background:var(--bg-hover);color:var(--txt-brt)}
.sb-nav.on{background:var(--bg-hover);border-left-color:var(--acc);color:var(--acc)}
/* main */
.main{padding:24px}
/* cards */
.card{background:var(--bg-surf);border:1px solid var(--brd);border-radius:6px;margin-bottom:16px;overflow:hidden}
.card-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--brd);font-size:.85rem;font-weight:600;color:var(--txt-brt)}
.card-body{padding:16px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--bg-surf);border:1px solid var(--brd);border-radius:6px;padding:14px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--acc),transparent)}
.stat-lbl{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--txt-dim);margin-bottom:4px}
.stat-val{font-size:1.7rem;font-weight:700;color:var(--txt-brt);line-height:1.2}
.stat-val.g{color:var(--grn)}.stat-val.r{color:var(--red)}.stat-val.a{color:var(--acc)}.stat-val.c{color:var(--cyn)}
/* badges */
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.65rem;font-weight:600}
.bg-g{background:var(--grn-dim);color:var(--grn)}.bg-r{background:var(--red-dim);color:var(--red)}
.bg-y{background:var(--ylw-dim);color:var(--ylw)}.bg-c{background:var(--cyn-dim);color:var(--cyn)}
.bg-p{background:rgba(155,77,255,.2);color:var(--acc)}
/* table */
.tbl{width:100%;border-collapse:collapse;font-size:.78rem}
.tbl th{text-align:left;padding:7px 10px;border-bottom:1px solid var(--brd);color:var(--txt-dim);font-weight:600;font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid rgba(42,42,64,.4);vertical-align:top}
.tbl tr:hover td{background:var(--bg-hover)}
.tbl .time{white-space:nowrap;color:var(--txt-dim);font-size:.72rem}
.tbl .hash{font-size:.7rem;color:var(--txt-dim);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* policy */
.pol-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pol-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(42,42,64,.3)}
.pol-key{color:var(--txt-dim);font-size:.78rem}
.pol-val{color:var(--txt-brt);font-size:.82rem;font-weight:500}
.pol-val code{background:var(--bg-elev);padding:1px 5px;border-radius:3px;font-size:.75rem}
/* verify */
.verify{display:flex;align-items:center;gap:10px;padding:14px;border-radius:6px;margin-bottom:14px}
.verify.ok{background:rgba(61,255,155,.07);border:1px solid var(--grn-dim)}
.verify.bad{background:rgba(255,61,87,.07);border:1px solid var(--red-dim}
.verify-icon{font-size:1.3rem}
/* status dot */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dot.g{background:var(--grn);box-shadow:0 0 6px var(--grn-dim);animation:pulse 2s ease-in-out infinite}
.dot.r{background:var(--red);box-shadow:0 0 6px var(--red-dim)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* detail block */
.db{background:var(--bg);border:1px solid var(--brd);border-radius:4px;padding:6px 10px;font-size:.68rem;color:var(--txt-dim);max-height:100px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
/* empty */
.empty{text-align:center;padding:30px;color:var(--txt-dim);font-size:.82rem}
/* footer */
.page-foot{margin-top:24px;padding-top:12px;border-top:1px solid var(--brd);font-size:.68rem;color:var(--txt-dim);display:flex;justify-content:space-between}
@media(max-width:768px){
  .wrap{grid-template-columns:1fr}
  .sb{position:static;height:auto;display:flex;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--brd);padding:0}
  .sb-logo{display:none}.sb-sec{display:none}
  .sb-nav{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;padding:10px 14px}
  .sb-nav.on{border-left-color:transparent;border-bottom-color:var(--acc)}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="sb">
    <div class="sb-logo"><a href="/dashboard/">DEMON<span>CLAW</span></a></div>
    <div class="sb-sec">Operations</div>
    <a class="sb-nav {% if page == 'dashboard' %}on{% endif %}" href="/dashboard/">◈ Dashboard</a>
    <a class="sb-nav {% if page == 'evidence' %}on{% endif %}" href="/dashboard/evidence">◉ Evidence</a>
    <a class="sb-nav {% if page == 'policy' %}on{% endif %}" href="/dashboard/policy">◊ Policy</a>
    <a class="sb-nav {% if page == 'memory' %}on{% endif %}" href="/dashboard/memory">◈ Memory</a>
    <a class="sb-nav {% if page == 'payloads' %}on{% endif %}" href="/dashboard/payloads">◊ Payloads</a>
    <div class="sb-sec">System</div>
    <a class="sb-nav" href="/healthz">◎ Health</a>
    <a class="sb-nav" href="/api/status">◎ API Status</a>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
    <div class="page-foot">
      <span>DemonClaw v1.0 — Purple Team Runtime</span>
      <span id="ts"></span>
    </div>
  </main>
</div>
<script>document.getElementById('ts').textContent=new Date().toLocaleString()</script>
</body>
</html>
